<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Setting</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; display: flex; justify-content: center; }
        
        .login-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(44, 62, 80, 0.95); 
            display: flex; justify-content: center; align-items: center; 
            z-index: 999; 
        }
        .login-card { background: #ffffff; padding: 30px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        
        .container { width: 100%; max-width: 900px; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px; display: none; }
        .container.active { display: block !important; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; }
        h2, h3 { color: #2c3e50; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #fdfdfd; padding: 20px; border: 1px solid #eef2f5; border-radius: 8px; margin-bottom: 30px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-size: 13px; font-weight: 600; color: #4a5568; }
        input { padding: 10px 14px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; outline: none; }
        
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; padding: 6px 12px; font-size: 12px; }
        .btn-logout { background-color: #95a5a6; color: white; }
        
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #eef2f5; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 12px 16px; border-bottom: 1px solid #edf2f7; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-hadir { background: #d4edda; color: #155724; }
        .badge-izin { background: #fff3cd; color: #856404; }
        .badge-sakit { background: #cce5ff; color: #004085; }
        .badge-alpha { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <!-- OVERLAY PIN LOGIN ADMIN -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h3>Login Admin</h3>
            <p style="font-size:13px; color:#7f8c8d; margin-bottom:15px;">Masukkan PIN Admin Rahasia</p>
            <form id="formLoginAdmin">
                <input type="password" id="pinAdminInput" placeholder="PIN Admin" required style="width:100%; margin-bottom:15px; text-align:center;">
                <button type="submit" class="btn btn-primary" style="width:100%;">Masuk Panel</button>
            </form>
            <a href="index.html" style="display:inline-block; margin-top:15px; font-size:12px; color:#7f8c8d; text-decoration:none;">&larr; Kembali ke absensi</a>
        </div>
    </div>

    <!-- MAIN PANEL ADMIN -->
    <div id="adminPanel" class="container">
        <div class="header">
            <h2>Panel Admin Setting</h2>
            <button id="btnLogout" class="btn btn-logout">Logout Admin</button>
        </div>

        <h3>Tambah Master Data Siswa</h3>
        <form id="formMaster" class="form-grid">
            <div class="form-group">
                <label>Kelas</label>
                <input type="text" id="adminKelas" placeholder="Contoh: XII IPA 1" required>
            </div>
            <div class="form-group">
                <label>Nama Siswa</label>
                <input type="text" id="adminNama" placeholder="Contoh: Budi Santoso" required>
            </div>
            <div class="form-group">
                <label>PIN Akun Siswa</label>
                <input type="password" id="adminPin" maxlength="6" placeholder="Contoh: 1234" required>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="btn btn-primary">Simpan Siswa</button>
            </div>
        </form>

        <h3>Daftar Siswa Terdaftar</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Kelas</th>
                        <th>Nama</th>
                        <th>PIN Akun</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelMasterData"></tbody>
            </table>
        </div>

        <h3>Rekap Daftar Kehadiran</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Kelas</th>
                        <th>Nama</th>
                        <th>Tanggal</th>
                        <th>Keterangan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelAbsensi"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const PIN_ADMIN_RAHASIA = "1234"; // Pastikan dalam bentuk teks (string)

        document.getElementById('formLoginAdmin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pinInput = document.getElementById('pinAdminInput').value.trim();

            if (String(pinInput) === String(PIN_ADMIN_RAHASIA)) {
                // Sembunyikan overlay login
                document.getElementById('loginOverlay').style.display = 'none';
                
                // Tampilkan container panel
                const panel = document.getElementById('adminPanel');
                panel.classList.add('active');
                
                // Load data dari Supabase
                await loadAllData();
            } else {
                alert("PIN Admin Salah!");
                document.getElementById('pinAdminInput').value = "";
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => location.reload());

        async function loadAllData() {
            await loadMasterSiswa();
            await loadAbsensi();
        }

        // --- MASTER SISWA ---
        async function loadMasterSiswa() {
            try {
                const { data, error } = await supabase.from('master_siswa').select('*').order('id', { ascending: false });
                if (error) throw error;

                const tbody = document.getElementById('tabelMasterData');
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Belum ada siswa.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.kelas}</td>
                            <td>${item.nama}</td>
                            <td>${item.pin}</td>
                            <td><button class="btn btn-danger" onclick="hapusMaster(${item.id})">Hapus</button></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error loading master data:", err);
            }
        }

        document.getElementById('formMaster').addEventListener('submit', async (e) => {
            e.preventDefault();
            const kelas = document.getElementById('adminKelas').value.trim();
            const nama = document.getElementById('adminNama').value.trim();
            const pin = document.getElementById('adminPin').value.trim();

            const { error } = await supabase.from('master_siswa').insert([{ kelas, nama, pin }]);
            if (error) {
                alert("Gagal menambahkan siswa!");
                console.error(error);
            } else {
                document.getElementById('formMaster').reset();
                loadMasterSiswa();
            }
        });

        window.hapusMaster = async (id) => {
            if (confirm("Hapus siswa ini dari database?")) {
                await supabase.from('master_siswa').delete().eq('id', id);
                loadMasterSiswa();
            }
        };

        // --- ABSENSI ---
        async function loadAbsensi() {
            try {
                const { data, error } = await supabase.from('absensi').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                const tbody = document.getElementById('tabelAbsensi');
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada riwayat absensi.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const badgeClass = `badge-${item.keterangan.toLowerCase()}`;
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.kelas}</td>
                            <td>${item.nama}</td>
                            <td>${item.tanggal}</td>
                            <td><span class="badge ${badgeClass}">${item.keterangan}</span></td>
                            <td><button class="btn btn-danger" onclick="hapusAbsensi(${item.id})">Hapus</button></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error loading absensi data:", err);
            }
        }

        window.hapusAbsensi = async (id) => {
            if (confirm("Hapus catatan absensi ini?")) {
                await supabase.from('absensi').delete().eq('id', id);
                loadAbsensi();
            }
        };
    </script>
</body>
</html>
