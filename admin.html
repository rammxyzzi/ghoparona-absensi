<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Rekap Absensi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080b11; color: #f1f5f9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: rgba(18, 24, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
        
        /* TOGGLE SWITCH */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <h2>Panel Admin Setting</h2>
            <button class="btn-danger" id="btnLogoutAdmin">Logout Admin</button>
        </div>

        <!-- MODE MAINTENANCE TOGGLE (FIX ERROR 409 UPSERT) -->
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h4 style="color: #38bdf8;"><i class="fa-solid fa-wrench"></i> Mode Maintenance (Perbaikan Web)</h4>
                <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Aktifkan untuk menutup akses siswa ke halaman absensi secara sementara.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleMaintenance">
                <span class="slider"></span>
            </label>
        </div>

        <!-- TAMBAH DATA SISWA -->
        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 15px; color: #38bdf8;">Tambah Master Data Siswa</h3>
            <form id="formTambahSiswa">
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Kelas</label>
                        <input type="text" id="addKelas" placeholder="Contoh: X TKJ" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Siswa</label>
                        <input type="text" id="addNama" placeholder="Contoh: Budi Santoso" required>
                    </div>
                    <div class="form-group">
                        <label>Username / Password</label>
                        <input type="text" id="addPassword" placeholder="Contoh: 1234" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Simpan Siswa</button>
            </form>
        </div>

    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const toggleMaintenance = document.getElementById('toggleMaintenance');

        // 1. CEK STATUS MAINTENANCE SAAT AWAL
        async function getMaintenanceStatus() {
            const { data } = await supabase.from('settings').select('value').eq('key', 'maintenance').single();
            if (data) {
                toggleMaintenance.checked = (data.value === 'true');
            }
        }
        getMaintenanceStatus();

        // 2. SIMPAN MAINTENANCE MENGGUNAKAN UPSERT (MENGHINDARI ERROR 409 CONFLICT)
        toggleMaintenance.addEventListener('change', async (e) => {
            const status = e.target.checked;

            const { error } = await supabase
                .from('settings')
                .upsert({ key: 'maintenance', value: String(status) }, { onConflict: 'key' });

            if (error) {
                Swal.fire({ icon: 'error', title: 'Gagal Update Status!', text: error.message });
                e.target.checked = !status;
            } else {
                Swal.fire({ 
                    icon: 'success', 
                    title: status ? 'Mode Maintenance Aktif!' : 'Mode Maintenance Dimatikan!', 
                    timer: 1500, 
                    showConfirmButton: false 
                });
            }
        });

        // 3. TAMBAH SISWA
        document.getElementById('formTambahSiswa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const kelas = document.getElementById('addKelas').value.trim();
            const nama = document.getElementById('addNama').value.trim();
            const password = document.getElementById('addPassword').value.trim();
            const username = nama.toLowerCase().replace(/\s+/g, '');

            const { error } = await supabase.from('master_siswa').insert([{ kelas, nama, username, password }]);

            if (error) {
                Swal.fire({ icon: 'error', title: 'Gagal Menambah Siswa', text: error.message });
            } else {
                Swal.fire({ icon: 'success', title: 'Siswa Berhasil Ditambahkan!' });
                document.getElementById('formTambahSiswa').reset();
            }
        });

        document.getElementById('btnLogoutAdmin').addEventListener('click', () => {
            location.href = 'index.html';
        });
    </script>
</body>
</html>
