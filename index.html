<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Digital + Face Detection</title>
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            padding: 25px; 
        }

        h2 { color: #2c3e50; margin-bottom: 15px; text-align: center; font-weight: 700; }

        /* KAMERA & FRAME DETEKSI */
        .camera-container {
            position: relative;
            width: 100%;
            height: 240px;
            background: #1a202c;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 4px solid #e74c3c; /* Merah default jika belum deteksi muka */
            transition: border-color 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-container.valid {
            border-color: #2ecc71; /* Hijau saat muka terdeteksi */
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror kamera */
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
        label { font-size: 13px; font-weight: 600; color: #4a5568; }
        input, select { 
            padding: 10px 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            transition: all 0.2s ease; 
        }
        input:focus, select:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25); }

        .btn { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            background-color: #3498db; 
            color: white; 
            transition: all 0.2s ease; 
            margin-top: 5px; 
        }
        .btn:disabled { background-color: #a0aec0; cursor: not-allowed; transform: none; }
        .btn:hover:not(:disabled) { background-color: #2980b9; transform: translateY(-1px); }
        
        .admin-link { display: block; text-align: center; margin-top: 15px; font-size: 13px; color: #7f8c8d; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Absensi Siswa + Scan Wajah</h2>

        <!-- UI KAMERA -->
        <div id="camBox" class="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <div id="camStatus" class="status-badge">🔴 Mengirim Sinyal Kamera...</div>
        </div>

        <form id="formAbsensi">
            <div class="form-group">
                <label for="selectKelas">Kelas</label>
                <select id="selectKelas" required>
                    <option value="">-- Memuat Kelas... --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="selectNama">Nama Siswa</label>
                <select id="selectNama" required>
                    <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputTanggal">Tanggal</label>
                <input type="date" id="inputTanggal" required readonly style="background-color: #edf2f7;">
            </div>

            <div class="form-group">
                <label for="selectKeterangan">Keterangan</label>
                <select id="selectKeterangan" required>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Alpha">Alpha</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputPin">PIN Akun Siswa</label>
                <input type="password" id="inputPin" maxlength="6" placeholder="Masukkan PIN Anda" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn" disabled>Arahkan Wajah ke Kamera</button>
        </form>
    </div>

    <!-- Canvas Tersembunyi untuk Capture Foto -->
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Face API AI Library -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <script type="module">
        import { supabase } from './supabase.js';

        let masterSiswa = [];
        let isFaceDetected = false;
        const video = document.getElementById('webcam');
        const camBox = document.getElementById('camBox');
        const camStatus = document.getElementById('camStatus');
        const btnSubmit = document.getElementById('btnSubmit');

        document.addEventListener("DOMContentLoaded", async () => {
            document.getElementById('inputTanggal').value = new Date().toISOString().split('T')[0];
            await loadMasterSiswa();
            startCamera();

            document.getElementById('selectKelas').addEventListener('change', filterSiswaByKelas);
            document.getElementById('formAbsensi').addEventListener('submit', simpanAbsensi);
        });

        // 1. Jalankan Kamera Web
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 400, height: 300 } });
                video.srcObject = stream;
                
                // Load AI Model Face Detection
                camStatus.innerText = "🔄 Memuat Model AI Wajah...";
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
                
                camStatus.innerText = "🔴 Muka Tidak Terdeteksi";
                detectFaceLoop();
            } catch (err) {
                alert("Gagal mengakses kamera! Izinkan akses kamera di browser Anda.");
                console.error(err);
            }
        }

        // 2. Loop Deteksi Wajah Secara Realtime
        async function detectFaceLoop() {
            setInterval(async () => {
                if (video.paused || video.ended) return;

                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 }));

                if (detections.length > 0) {
                    isFaceDetected = true;
                    camBox.classList.add('valid');
                    camStatus.innerText = "🟢 Wajah Terdeteksi";
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Kirim Absensi";
                } else {
                    isFaceDetected = false;
                    camBox.classList.remove('valid');
                    camStatus.innerText = "🔴 Muka Tidak Terdeteksi";
                    btnSubmit.disabled = true;
                    btnSubmit.innerText = "Arahkan Wajah ke Kamera";
                }
            }, 300);
        }

        async function loadMasterSiswa() {
            const { data } = await supabase.from('master_siswa').select('*');
            masterSiswa = data || [];
            const selectKelas = document.getElementById('selectKelas');
            const daftarKelas = [...new Set(masterSiswa.map(item => item.kelas))];

            selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            daftarKelas.forEach(kelas => {
                selectKelas.innerHTML += `<option value="${kelas}">${kelas}</option>`;
            });
        }

        function filterSiswaByKelas() {
            const kelasDipilih = document.getElementById('selectKelas').value;
            const selectNama = document.getElementById('selectNama');
            selectNama.innerHTML = '<option value="">-- Pilih Nama --</option>';
            if (!kelasDipilih) return;

            const siswaFiltered = masterSiswa.filter(item => item.kelas === kelasDipilih);
            siswaFiltered.forEach(siswa => {
                selectNama.innerHTML += `<option value="${siswa.nama}">${siswa.nama}</option>`;
            });
        }

        // 3. Take Photo & Upload ke Supabase
        async function takeSnapshotAndUpload(nama, kelas) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Mirror efek agar sesuai video
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    const fileName = `${kelas}_${nama}_${Date.now()}.jpg`;
                    const { data, error } = await supabase.storage.from('foto-absensi').upload(fileName, blob);
                    
                    if (error) {
                        console.error("Gagal Upload Foto:", error);
                        resolve(null);
                    } else {
                        const { data: publicUrlData } = supabase.storage.from('foto-absensi').getPublicUrl(fileName);
                        resolve(publicUrlData.publicUrl);
                    }
                }, 'image/jpeg', 0.8);
            });
        }

        // 4. Form Absen Submission
        async function simpanAbsensi(e) {
            e.preventDefault();

            if (!isFaceDetected) {
                Swal.fire({ icon: 'warning', title: 'Wajah Tidak Kelihatan!', text: 'Posisikan wajah Anda pas di depan kamera!' });
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Mengambil Foto & Memproses...";

            const kelas = document.getElementById('selectKelas').value;
            const nama = document.getElementById('selectNama').value;
            const tanggal = document.getElementById('inputTanggal').value;
            const keterangan = document.getElementById('selectKeterangan').value;
            const pinInput = document.getElementById('inputPin').value;

            // Validasi PIN
            const siswaValid = masterSiswa.find(item => item.kelas === kelas && item.nama === nama && String(item.pin) === String(pinInput));
            if (!siswaValid) {
                Swal.fire({ icon: 'error', title: 'PIN Salah!', text: 'PIN Akun Siswa yang Anda masukkan salah.' });
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Absensi";
                return;
            }

            // Validasi 1x Sehari
            const { data: absensiAda } = await supabase.from('absensi').select('id').eq('nama', nama).eq('kelas', kelas).eq('tanggal', tanggal);
            if (absensiAda && absensiAda.length > 0) {
                Swal.fire({ icon: 'warning', title: 'Sudah Absen!', text: `${nama} sudah melakukan absensi hari ini!` });
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Absensi";
                return;
            }

            // Upload Foto
            const fotoUrl = await takeSnapshotAndUpload(nama, kelas);

            // Simpan Data Ke DB
            const { error } = await supabase.from('absensi').insert([
                { kelas, nama, tanggal, keterangan, foto_url: fotoUrl }
            ]);

            if (error) {
                Swal.fire({ icon: 'error', title: 'Gagal Simpan!', text: error.message });
            } else {
                Swal.fire({ icon: 'success', title: 'Berhasil Absen!', text: `Absensi dan Foto ${nama} berhasil dikirim!` });
                document.getElementById('inputPin').value = "";
            }

            btnSubmit.disabled = false;
            btnSubmit.innerText = "Kirim Absensi";
        }
    </script>
</body>
</html>
