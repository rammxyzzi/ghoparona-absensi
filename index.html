<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi - SMKNU</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #12181f;
            --card-bg: #1a222d;
            --primary: #00f2fe;
            --primary-hover: #00c6ff;
            --border-color: #2b3648;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .nav-tabs {
            display: flex;
            background-color: var(--bg-main);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 10px;
            color: #000000;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ==========================================
           SPLASH SCREEN & LOADING ANIMATION
           ========================================== */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splashScreen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            opacity: 0;
            transform: scale(0.7);
            animation: logoAppear 2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
        }

        .splash-loader {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 1px;
            animation: pulseText 1.5s infinite ease-in-out;
        }

        @keyframes logoAppear {
            0% {
                opacity: 0;
                transform: scale(0.6);
                filter: blur(8px);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ==========================================
           TOAST NOTIFICATION (ALA ACODE)
           ========================================== */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: calc(100% - 32px);
            max-width: 440px;
            background-color: #232a31;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            width: 36px;
            height: 36px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .toast-body h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .toast-body p {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Splash Screen Intro -->
    <div id="splashScreen">
        <div class="splash-logo">SMKNU</div>
        <div class="splash-loader">Memuat aplikasi...</div>
    </div>

    <!-- Main App Container -->
    <div class="container">
        <div class="header">
            <h1>Sistem Presensi</h1>
            <p>SMKNU Online Presence System</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('presensiTab')">Presensi</button>
            <button class="tab-btn" onclick="switchTab('adminTab')">Dashboard Admin</button>
        </div>

        <!-- TAB PRESENSI -->
        <div id="presensiTab" class="tab-content active">
            <form id="presensiForm" onsubmit="submitPresensi(event)">
                <div class="form-group">
                    <label>PILIH KELAS</label>
                    <select id="selectKelas" class="form-control" onchange="loadSiswaByKelas()" required>
                        <option value="">-- Pilih Kelas --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>PILIH SISWA</label>
                    <select id="selectSiswa" class="form-control" required disabled>
                        <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>KETERANGAN PRESENSI</label>
                    <select id="selectStatus" class="form-control" required>
                        <option value="Hadir">Hadir</option>
                        <option value="Izin">Izin</option>
                        <option value="Sakit">Sakit</option>
                    </select>
                </div>

                <button type="submit" id="btnKirim" class="btn">KIRIM PRESENSI</button>
            </form>
        </div>

        <!-- TAB ADMIN -->
        <div id="adminTab" class="tab-content">
            <div class="form-group">
                <label>TAMBAH KELAS BARU</label>
                <input type="text" id="inputNamaKelas" class="form-control" placeholder="Contoh: XII RPL 1">
                <button type="button" class="btn" style="margin-top: 8px;" onclick="tambahKelas()">SIMPAN KELAS</button>
            </div>

            <hr style="border-color: var(--border-color); margin: 20px 0;">

            <div class="form-group">
                <label>PILIH KELAS UNTUK SISWA</label>
                <select id="selectKelasAdmin" class="form-control">
                    <option value="">-- Pilih Kelas --</option>
                </select>
            </div>

            <div class="form-group">
                <label>NAMA LENGKAP SISWA</label>
                <input type="text" id="inputNamaSiswa" class="form-control" placeholder="Contoh: Ahmad Rizki">
                <button type="button" class="btn" style="margin-top: 8px;" onclick="tambahSiswa()">SIMPAN SISWA</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Ala Acode -->
    <div id="toastNotif" class="toast-notification">
        <div class="toast-icon">✓</div>
        <div class="toast-body">
            <h4 id="toastTitle">Presensi Berhasil!</h4>
            <p id="toastMessage">Data tersimpan & info dikirim via WhatsApp.</p>
        </div>
    </div>

    <script>
        // KONFIGURASI LENGKAP SUPABASE & WASENDER
        const SUPABASE_URL = "https://lwzeobrzpzjxiywdwuws.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3emVvYnJ6cHpqeGl5d2R3dXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODE2NDgsImV4cCI6MjEwMTA1NzY0OH0.kSQ3yvm2JwpPo4qRkRDxmEpkwrzpktGYBU0HAg3PXx4";
        
        const WASENDER_API_KEY = "973177ee012529e6e32c60b4882ac5378d3813cb1d4cf7f65013d3ad3bbaf72c";
        const WASENDER_GROUP_JID = "6283872851796";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // HILANGKAN SPLASH SCREEN
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) splash.classList.add('hide');
            }, 2500);

            loadKelas();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function showToast(title, message) {
            const toast = document.getElementById('toastNotif');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // LOAD DAFTAR KELAS
        async function loadKelas() {
            const { data, error } = await supabaseClient.from('kelas').select('*').order('nama_kelas', { ascending: true });
            if (error) return console.error(error);

            const selectKelas = document.getElementById('selectKelas');
            const selectKelasAdmin = document.getElementById('selectKelasAdmin');

            selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            selectKelasAdmin.innerHTML = '<option value="">-- Pilih Kelas --</option>';

            data.forEach(item => {
                selectKelas.innerHTML += `<option value="${item.id}">${item.nama_kelas}</option>`;
                selectKelasAdmin.innerHTML += `<option value="${item.id}">${item.nama_kelas}</option>`;
            });
        }

        // LOAD SISWA BERDASARKAN KELAS
        async function loadSiswaByKelas() {
            const kelasId = document.getElementById('selectKelas').value;
            const selectSiswa = document.getElementById('selectSiswa');

            if (!kelasId) {
                selectSiswa.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
                selectSiswa.disabled = true;
                return;
            }

            const { data, error } = await supabaseClient.from('siswa').select('*').eq('kelas_id', kelasId).order('nama', { ascending: true });
            if (error) return console.error(error);

            selectSiswa.innerHTML = '<option value="">-- Pilih Siswa --</option>';
            data.forEach(item => {
                selectSiswa.innerHTML += `<option value="${item.id}">${item.nama}</option>`;
            });
            selectSiswa.disabled = false;
        }

        // TAMBAH KELAS
        async function tambahKelas() {
            const namaKelas = document.getElementById('inputNamaKelas').value.trim();
            if (!namaKelas) return alert('Nama kelas tidak boleh kosong!');

            const { error } = await supabaseClient.from('kelas').insert([{ nama_kelas: namaKelas }]);
            if (error) {
                alert('Gagal menambah kelas: ' + error.message);
            } else {
                document.getElementById('inputNamaKelas').value = '';
                showToast('Berhasil!', 'Kelas baru telah ditambahkan.');
                loadKelas();
            }
        }

        // TAMBAH SISWA
        async function tambahSiswa() {
            const kelasId = document.getElementById('selectKelasAdmin').value;
            const namaSiswa = document.getElementById('inputNamaSiswa').value.trim();

            if (!kelasId || !namaSiswa) return alert('Pilih kelas dan isi nama siswa!');

            const { error } = await supabaseClient.from('siswa').insert([{ kelas_id: kelasId, nama: namaSiswa }]);
            if (error) {
                alert('Gagal menambah siswa: ' + error.message);
            } else {
                document.getElementById('inputNamaSiswa').value = '';
                showToast('Berhasil!', 'Siswa baru telah ditambahkan.');
            }
        }

        // KIRIM PRESENSI & WHATSAPP
        async function submitPresensi(e) {
            e.preventDefault();
            const btnKirim = document.getElementById('btnKirim');
            btnKirim.disabled = true;
            btnKirim.innerText = 'MENGIRIM...';

            const selectKelas = document.getElementById('selectKelas');
            const selectSiswa = document.getElementById('selectSiswa');
            const status = document.getElementById('selectStatus').value;

            const namaKelas = selectKelas.options[selectKelas.selectedIndex].text;
            const namaSiswa = selectSiswa.options[selectSiswa.selectedIndex].text;
            const siswaId = selectSiswa.value;

            // 1. Simpan ke Supabase
            const { error } = await supabaseClient.from('presensi').insert([
                { siswa_id: siswaId, status: status, tanggal: new Date().toISOString() }
            ]);

            if (error) {
                alert('Gagal menyimpan presensi: ' + error.message);
            } else {
                // 2. Play Sound Efek Ting
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play().catch(() => {});

                // 3. Kirim WhatsApp via WaSenderAPI
                if (WASENDER_API_KEY) {
                    const pesan = `*PRESENSI SISWA SMKNU*\n\nNama: ${namaSiswa}\nKelas: ${namaKelas}\nKeterangan: ${status}\nWaktu: ${new Date().toLocaleString('id-ID')}`;
                    
                    fetch('https://wasenderapi.com/api/send-text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            api_key: WASENDER_API_KEY,
                            receiver: WASENDER_GROUP_JID,
                            data: { message: pesan }
                        })
                    }).catch(err => console.error("Error WA:", err));
                }

                showToast('Presensi Berhasil!', `${namaSiswa} (${namaKelas}) - ${status}`);
                document.getElementById('presensiForm').reset();
                document.getElementById('selectSiswa').disabled = true;
            }

            btnKirim.disabled = false;
            btnKirim.innerText = 'KIRIM PRESENSI';
        }
    </script>
</body>
</html>
