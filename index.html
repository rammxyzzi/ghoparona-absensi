<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Digital Siswa</title>
    <!-- SweetAlert2 CSS untuk Notifikasi Modern -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* BACKGROUND BERUBAH WARNA (ANIMATED GRADIENT) */
        body { 
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            position: relative; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* SPLASH SCREEN STYLES */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .school-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .loading-text {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.98); opacity: 0.8; }
        }

        /* FORM CARD GLASSMORPHISM STYLES */
        .card { 
            width: 100%; 
            max-width: 460px; 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            padding: 30px; 
        }
        
        h2 { color: #2c3e50; margin-bottom: 20px; text-align: center; font-weight: 700; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 13px; font-weight: 600; color: #4a5568; }
        input, select { 
            padding: 12px 14px; 
            border: 1px solid #cbd5e0; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            transition: all 0.2s ease; 
            background: #fff;
        }
        input:focus, select:focus { 
            border-color: #3498db; 
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25); 
        }
        .btn { 
            width: 100%; 
            padding: 13px; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            background-color: #3498db; 
            color: white; 
            transition: all 0.2s ease; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        .btn:hover { background-color: #2980b9; transform: translateY(-1px); }
        .admin-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #7f8c8d; text-decoration: none; font-weight: 500; }
        .admin-link:hover { color: #2c3e50; }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN / LOADING ANIMATION -->
    <div id="splashScreen">
        <img src="logo-sekolah.jpeg" alt="Logo Sekolah" class="school-logo">
        <div class="loading-text">Memuat Sistem Absensi...</div>
    </div>

    <!-- MAIN FORM ABSENSI -->
    <div class="card">
        <h2>Form Absensi Siswa</h2>
        <form id="formAbsensi">
            <div class="form-group">
                <label for="selectKelas">Kelas</label>
                <select id="selectKelas" required>
                    <option value="">-- Memuat Kelas... --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="selectNama">Nama Siswa</label>
                <select id="selectNama" required>
                    <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputTanggal">Tanggal</label>
                <input type="date" id="inputTanggal" required readonly style="background-color: #edf2f7; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label for="selectKeterangan">Keterangan</label>
                <select id="selectKeterangan" required>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Alpha">Alpha</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputPin">PIN Akun Siswa</label>
                <input type="password" id="inputPin" maxlength="6" placeholder="Masukkan PIN Anda" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn">Kirim Absensi</button>
        </form>
    </div>

    <!-- SweetAlert2 JS untuk Notifikasi Modern -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { supabase } from './supabase.js';

        let masterSiswa = [];

        // Konfigurasi Toast Modern
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true
        });

        document.addEventListener("DOMContentLoaded", async () => {
            // Set tanggal hari ini secara otomatis
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputTanggal').value = today;
            
            // Cek status maintenance
            const isMaintenance = await checkMaintenanceStatus();
            
            if (!isMaintenance) {
                await loadMasterSiswa();
                document.getElementById('selectKelas').addEventListener('change', filterSiswaByKelas);
                document.getElementById('formAbsensi').addEventListener('submit', simpanAbsensi);
            }

            // Sembunyikan Splash Screen
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.classList.add('hidden');
            }, 1200);
        });

        async function checkMaintenanceStatus() {
            try {
                const { data } = await supabase.from('settings').select('value').eq('key', 'maintenance').maybeSingle();
                if (data && data.value === 'true') {
                    document.querySelector('.card').innerHTML = `
                        <div style="text-align: center; padding: 20px 10px;">
                            <h2 style="color: #e74c3c; margin-bottom: 10px;">🛠️ Maintenance Mode</h2>
                            <p style="color: #7f8c8d; font-size: 14px; line-height: 1.5;">
                                Sistem absensi sedang dalam pemeliharaan oleh Admin.<br>
                                Silakan coba beberapa saat lagi.
                            </p>
                        </div>
                    `;
                    return true;
                }
            } catch (err) {
                console.error("Error checking maintenance:", err);
            }
            return false;
        }

        async function loadMasterSiswa() {
            const { data, error } = await supabase.from('master_siswa').select('*');
            if (error) {
                console.error("Gagal mengambil data:", error);
                Toast.fire({ icon: 'error', title: 'Gagal memuat data siswa' });
                return;
            }

            masterSiswa = data;
            const selectKelas = document.getElementById('selectKelas');
            const daftarKelas = [...new Set(masterSiswa.map(item => item.kelas))];

            selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            daftarKelas.forEach(kelas => {
                selectKelas.innerHTML += `<option value="${kelas}">${kelas}</option>`;
            });
        }

        function filterSiswaByKelas() {
            const kelasDipilih = document.getElementById('selectKelas').value;
            const selectNama = document.getElementById('selectNama');

            selectNama.innerHTML = '<option value="">-- Pilih Nama --</option>';
            if (!kelasDipilih) return;

            const siswaFiltered = masterSiswa.filter(item => item.kelas === kelasDipilih);
            siswaFiltered.forEach(siswa => {
                selectNama.innerHTML += `<option value="${siswa.nama}">${siswa.nama}</option>`;
            });
        }

        async function simpanAbsensi(e) {
            e.preventDefault();

            const isMaintenance = await checkMaintenanceStatus();
            if (isMaintenance) {
                Swal.fire({ icon: 'warning', title: 'Maintenance', text: 'Sistem baru saja masuk mode Maintenance!' });
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Memproses...";

            const kelas = document.getElementById('selectKelas').value;
            const nama = document.getElementById('selectNama').value;
            const tanggal = document.getElementById('inputTanggal').value;
            const keterangan = document.getElementById('selectKeterangan').value;
            const pinInput = document.getElementById('inputPin').value;

            // 1. Validasi PIN
            const siswaValid = masterSiswa.find(item => item.kelas === kelas && item.nama === nama && String(item.pin) === String(pinInput));

            if (!siswaValid) {
                Swal.fire({
                    icon: 'error',
                    title: 'PIN Salah!',
                    text: 'PIN Akun Siswa yang Anda masukkan tidak sesuai.',
                    confirmColor: '#e74c3c'
                });
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Absensi";
                return;
            }

            // 2. Validasi Siswa Hanya Bisa Absen 1x Sehari
            const { data: absensiAda, error: errorCek } = await supabase
                .from('absensi')
                .select('id')
                .eq('nama', nama)
                .eq('kelas', kelas)
                .eq('tanggal', tanggal);

            if (errorCek) {
                console.error("Error cek absensi:", errorCek);
            }

            if (absensiAda && absensiAda.length > 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Sudah Absen!',
                    text: `Siswa atas nama ${nama} sudah melakukan absensi hari ini!`,
                    confirmColor: '#f39c12'
                });
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Absensi";
                return;
            }

            // 3. Simpan Absensi
            const { error } = await supabase.from('absensi').insert([
                { kelas, nama, tanggal, keterangan }
            ]);

            if (error) {
                Swal.fire({ icon: 'error', title: 'Gagal!', text: 'Terjadi kesalahan saat mengirim absensi.' });
                console.error(error);
            } else {
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil Absen!',
                    text: `Terima kasih ${nama}, absensi (${keterangan}) berhasil disimpan.`,
                    confirmColor: '#2ecc71'
                });
                document.getElementById('inputPin').value = "";
            }

            btnSubmit.disabled = false;
            btnSubmit.innerText = "Kirim Absensi";
        }
    </script>
</body>
</html>
