<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Digital Siswa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; }
        
        /* --- SPLASH SCREEN STYLES --- */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .school-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .loading-text {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.98); opacity: 0.8; }
        }

        /* --- FORM CARD STYLES --- */
        .card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px; }
        h2 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 14px; font-weight: 600; color: #4a5568; }
        input, select { padding: 11px 14px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; outline: none; transition: all 0.2s ease; }
        input:focus, select:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; background-color: #3498db; color: white; transition: all 0.2s ease; margin-top: 10px; }
        .btn:hover { background-color: #2980b9; transform: translateY(-1px); }
        .admin-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #7f8c8d; text-decoration: none; }
        .admin-link:hover { color: #3498db; }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN / LOADING ANIMATION -->
    <div id="splashScreen">
        <!-- Ganti src di bawah dengan URL gambar / file logo sekolah kamu -->
        <img src="logo-sekolah.jpeg" alt="Logo Sekolah" class="school-logo">
        <div class="loading-text">Memuat Server...</div>
    </div>

    <!-- MAIN FORM ABSENSI -->
    <div class="card">
        <h2>Form Absensi Siswa</h2>
        <form id="formAbsensi">
            <div class="form-group">
                <label for="selectKelas">Kelas</label>
                <select id="selectKelas" required>
                    <option value="">-- Memuat Kelas... --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="selectNama">Nama Siswa</label>
                <select id="selectNama" required>
                    <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputTanggal">Tanggal</label>
                <input type="date" id="inputTanggal" required>
            </div>

            <div class="form-group">
                <label for="selectKeterangan">Keterangan</label>
                <select id="selectKeterangan" required>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Alpha">Alpha</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputPin">PIN Akun Siswa</label>
                <input type="password" id="inputPin" maxlength="6" placeholder="Masukkan PIN Anda" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn">Kirim Absensi</button>
        </form>

        <a href="admin.html" class="admin-link">Masuk Halaman Admin &rarr;</a>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        let masterSiswa = [];

        document.addEventListener("DOMContentLoaded", async () => {
            document.getElementById('inputTanggal').valueAsDate = new Date();
            
            // Cek status maintenance
            const isMaintenance = await checkMaintenanceStatus();
            
            if (!isMaintenance) {
                await loadMasterSiswa();
                document.getElementById('selectKelas').addEventListener('change', filterSiswaByKelas);
                document.getElementById('formAbsensi').addEventListener('submit', simpanAbsensi);
            }

            // Sembunyikan Splash Screen setelah jeda sedikit agar efek loading terasa smooth (misal: 1.5 detik)
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.classList.add('hidden');
            }, 1500);
        });

        async function checkMaintenanceStatus() {
            try {
                const { data } = await supabase.from('settings').select('value').eq('key', 'maintenance').single();
                if (data && data.value === 'true') {
                    document.querySelector('.card').innerHTML = `
                        <div style="text-align: center; padding: 20px 10px;">
                            <h2 style="color: #e74c3c; margin-bottom: 10px;">🛠️ System Maintenance</h2>
                            <p style="color: #7f8c8d; font-size: 14px; line-height: 1.5;">
                                Sistem absensi sedang dalam pemeliharaan/update data oleh Admin.<br>
                                Silakan coba beberapa saat lagi.
                            </p>
                            <a href="admin.html" class="admin-link" style="margin-top: 30px;">Masuk Halaman Admin &rarr;</a>
                        </div>
                    `;
                    return true;
                }
            } catch (err) {
                console.error("Error checking maintenance:", err);
            }
            return false;
        }

        async function loadMasterSiswa() {
            const { data, error } = await supabase.from('master_siswa').select('*');
            if (error) {
                console.error("Gagal mengambil data:", error);
                return;
            }

            masterSiswa = data;
            const selectKelas = document.getElementById('selectKelas');
            const daftarKelas = [...new Set(masterSiswa.map(item => item.kelas))];

            selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            daftarKelas.forEach(kelas => {
                selectKelas.innerHTML += `<option value="${kelas}">${kelas}</option>`;
            });
        }

        function filterSiswaByKelas() {
            const kelasDipilih = document.getElementById('selectKelas').value;
            const selectNama = document.getElementById('selectNama');

            selectNama.innerHTML = '<option value="">-- Pilih Nama --</option>';
            if (!kelasDipilih) return;

            const siswaFiltered = masterSiswa.filter(item => item.kelas === kelasDipilih);
            siswaFiltered.forEach(siswa => {
                selectNama.innerHTML += `<option value="${siswa.nama}">${siswa.nama}</option>`;
            });
        }

        async function simpanAbsensi(e) {
            e.preventDefault();

            const isMaintenance = await checkMaintenanceStatus();
            if (isMaintenance) {
                alert("Sistem baru saja masuk mode Maintenance!");
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Mengirim...";

            const kelas = document.getElementById('selectKelas').value;
            const nama = document.getElementById('selectNama').value;
            const tanggal = document.getElementById('inputTanggal').value;
            const keterangan = document.getElementById('selectKeterangan').value;
            const pinInput = document.getElementById('inputPin').value;

            const siswaValid = masterSiswa.find(item => item.kelas === kelas && item.nama === nama && item.pin === pinInput);

            if (!siswaValid) {
                alert("PIN Akun Siswa Salah!");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Absensi";
                return;
            }

            const { error } = await supabase.from('absensi').insert([
                { kelas, nama, tanggal, keterangan }
            ]);

            if (error) {
                alert("Gagal mengirim absensi!");
                console.error(error);
            } else {
                alert(`Absensi ${nama} berhasil terkirim!`);
                document.getElementById('inputPin').value = "";
            }

            btnSubmit.disabled = false;
            btnSubmit.innerText = "Kirim Absensi";
        }
    </script>
</body>
</html>
