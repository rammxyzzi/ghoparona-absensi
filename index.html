<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Siswa</title>
    <!-- SweetAlert2 & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080b11; color: #f1f5f9; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        .card { width: 100%; max-width: 450px; background: rgba(18, 24, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 25px; backdrop-filter: blur(10px); text-align: center; }
        .header h2 { font-size: 20px; margin-bottom: 5px; color: #38bdf8; }
        .header p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white; outline: none; }
        .form-group select option { background: #121826; color: white; }
        
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-amber { background: linear-gradient(135deg, #f59e0b, #d97706); }

        #cameraContainer { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; display: none; }
        #webcam { width: 100%; transform: scaleX(-1); display: block; }
        #canvas { display: none; }
        
        .user-info-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .user-info-box h4 { color: #f1f5f9; font-size: 16px; }
        .user-info-box p { color: #38bdf8; font-size: 13px; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- SECTION LOGIN -->
    <div class="card" id="loginCard">
        <div class="header">
            <h2>Portal Absensi</h2>
            <p>Silakan masuk menggunakan akun Anda</p>
        </div>
        <form id="formLogin">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-primary" id="btnLogin"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
        </form>
    </div>

    <!-- SECTION ABSENSI -->
    <div class="card" id="absensiCard" style="display: none;">
        <div class="header">
            <h2>Presensi Kehadiran</h2>
            <p>Ambil foto untuk melakukan absensi hari ini</p>
        </div>

        <div class="user-info-box">
            <h4 id="dispNamaSiswa">-</h4>
            <p id="dispKelasSiswa">-</p>
        </div>

        <div id="cameraContainer">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <canvas id="canvas"></canvas>

        <button type="button" class="btn-primary btn-amber" id="btnStartCamera"><i class="fa-solid fa-camera"></i> Buka Kamera</button>
        <button type="button" class="btn-primary" id="btnKirimAbsen" style="display: none;"><i class="fa-solid fa-paper-plane"></i> Kirim Absen Sekarang</button>
        <button type="button" class="btn-primary btn-danger" id="btnLogout" style="margin-top: 15px;"><i class="fa-solid fa-power-off"></i> Keluar</button>
    </div>

    <!-- MAIN SCRIPT MODULE -->
    <script type="module">
        import { supabase } from './supabase.js';

        let videoStream = null;

        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });

        function checkSession() {
            const session = localStorage.getItem('userSession');
            if (session) {
                const user = JSON.parse(session);
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('absensiCard').style.display = 'block';

                document.getElementById('dispNamaSiswa').innerText = user.nama_lengkap || user.nama_guru || user.nama || user.username;
                document.getElementById('dispKelasSiswa').innerText = `Kelas/Akses: ${user.kelas || user.wali_kelas_dari || '-'}`;
            } else {
                document.getElementById('loginCard').style.display = 'block';
                document.getElementById('absensiCard').style.display = 'none';
            }
        }

        // HANDLE LOGIN AMAN (TANPA .single() ATAU .maybeSingle())
        document.getElementById('formLogin')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();
            const btnLogin = document.getElementById('btnLogin');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';

            try {
                // 1. Cek di tabel master_siswa
                const { data: siswaData, error: siswaErr } = await supabase
                    .from('master_siswa')
                    .select('*')
                    .eq('username', usernameInput)
                    .eq('password', passwordInput);

                if (!siswaErr && siswaData && siswaData.length > 0) {
                    const user = siswaData[0];
                    localStorage.setItem('userSession', JSON.stringify({ ...user, role: 'siswa' }));
                    Swal.fire('Berhasil Login', `Selamat datang, ${user.nama_lengkap || user.username}`, 'success').then(() => {
                        checkSession();
                    });
                    return;
                }

                // 2. Cek di tabel master_guru jika tidak ditemukan di siswa
                const { data: guruData, error: guruErr } = await supabase
                    .from('master_guru')
                    .select('*')
                    .eq('username', usernameInput)
                    .eq('password', passwordInput);

                if (!guruErr && guruData && guruData.length > 0) {
                    const user = guruData[0];
                    localStorage.setItem('userSession', JSON.stringify({ ...user, role: 'wali_kelas' }));
                    Swal.fire('Berhasil Login', `Selamat datang Wali Kelas ${user.nama_guru || user.username}`, 'success').then(() => {
                        checkSession();
                    });
                    return;
                }

                // 3. Jika data tidak ditemukan di kedua tabel
                Swal.fire('Login Gagal', 'Username atau password salah!', 'error');

            } catch (err) {
                console.error('Login error:', err);
                Swal.fire('Error', 'Terjadi kesalahan sistem', 'error');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
            }
        });

        // HANDLE BUKA KAMERA
        document.getElementById('btnStartCamera')?.addEventListener('click', async () => {
            const cameraContainer = document.getElementById('cameraContainer');
            const video = document.getElementById('webcam');
            const btnStart = document.getElementById('btnStartCamera');
            const btnKirim = document.getElementById('btnKirimAbsen');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                video.srcObject = videoStream;
                cameraContainer.style.display = 'block';
                btnStart.style.display = 'none';
                btnKirim.style.display = 'block';
            } catch (err) {
                Swal.fire('Kamera Akses Ditolak', 'Izinkan akses kamera pada browser Anda.', 'error');
            }
        });

        // HANDLE KIRIM ABSEN
        document.getElementById('btnKirimAbsen')?.addEventListener('click', async () => {
            const btnKirim = document.getElementById('btnKirimAbsen');
            btnKirim.disabled = true;
            btnKirim.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan Absen...';

            const user = JSON.parse(localStorage.getItem('userSession'));
            if (!user) {
                Swal.fire('Sesi Habis', 'Silakan login kembali', 'warning');
                logout();
                return;
            }

            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                let fotoUrl = null;

                if (blob) {
                    const fileName = `absen_${user.username}_${Date.now()}.jpg`;
                    const filePath = `bukti_absensi/${fileName}`;

                    const { error: uploadError } = await supabase.storage
                        .from('school_media')
                        .upload(filePath, blob, { contentType: 'image/jpeg' });

                    if (!uploadError) {
                        const { data: urlData } = supabase.storage.from('school_media').getPublicUrl(filePath);
                        fotoUrl = urlData.publicUrl;
                    }
                }

                const namaTersimpan = user.nama_lengkap || user.nama_guru || user.nama || user.username;
                const kelasTersimpan = user.kelas || user.wali_kelas_dari || '-';
                const todayStr = new Date().toISOString().split('T')[0];

                const { error: insertError } = await supabase
                    .from('absensi')
                    .insert([
                        {
                            nama: namaTersimpan,
                            kelas: kelasTersimpan,
                            tanggal: todayStr,
                            status: 'Hadir',
                            foto_url: fotoUrl
                        }
                    ]);

                btnKirim.disabled = false;
                btnKirim.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Absen Sekarang';

                if (insertError) {
                    Swal.fire('Gagal Absen', insertError.message, 'error');
                } else {
                    Swal.fire('Berhasil!', 'Absensi Anda hari ini berhasil disimpan.', 'success').then(() => {
                        stopCamera();
                        location.reload();
                    });
                }
            }, 'image/jpeg', 0.8);
        });

        // HANDLE LOGOUT
        document.getElementById('btnLogout')?.addEventListener('click', () => {
            logout();
        });

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function logout() {
            stopCamera();
            localStorage.removeItem('userSession');
            checkSession();
        }
    </script>
</body>
</html>
