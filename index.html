<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Sekolah & Panel Wali Kelas</title>
    <!-- SweetAlert2 & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Face-API AI Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080b11; color: #f1f5f9; min-height: 100vh; padding-bottom: 90px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; padding: 20px; }
        .card { background: rgba(18, 24, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white; outline: none; }
        .form-group select option { background: #121826; color: white; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge-role { font-size: 10px; background: #38bdf8; color: #080b11; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
        
        /* Table Monitor Wali Kelas */
        .table-custom { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        .table-custom th, .table-custom td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .table-custom th { color: #38bdf8; font-weight: 600; }
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .status-hadir { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .status-belum { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        /* Floating Nav */
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 480px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; display: flex; justify-around; align-items: center; padding: 10px 15px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; text-decoration: none; font-size: 10px; gap: 3px; cursor: pointer; }
        .nav-item.active { color: #38bdf8; font-weight: 600; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ================= 1. FORM LOGIN SIKAS ================= -->
        <div id="loginScreen" class="card" style="margin-top: 40px;">
            <div style="font-size: 40px; margin-bottom: 10px; text-align: center;">🏫</div>
            <h2 style="font-size: 20px; margin-bottom: 6px; text-align: center;">Portal Absensi Sekolah</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px; text-align: center;">Masuk sebagai Siswa atau Wali Kelas</p>

            <form id="formLogin">
                <div class="form-group">
                    <label>Role / Tipe Akun</label>
                    <select id="loginRole" required>
                        <option value="siswa">Siswa</option>
                        <option value="wali_kelas">Wali Kelas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Masukkan Username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Masukkan Password" required>
                </div>
                <button type="submit" class="btn-primary">Masuk &rarr;</button>
            </form>
        </div>

        <!-- ================= 2. DASHBOARD SISWA ================= -->
        <div id="siswaDashboardScreen" style="display: none;">
            <div class="header">
                <div>
                    <span class="badge-role">SISWA</span>
                    <h3 id="siswaNamaHeader" style="margin-top: 4px;">-</h3>
                    <p id="siswaKelasHeader" style="font-size: 12px; color: #94a3b8;">-</p>
                </div>
                <i class="fa-solid fa-right-from-bracket btnLogout" style="color: #ef4444; cursor: pointer; font-size: 18px;" title="Logout"></i>
            </div>

            <!-- TAB ABSENSI KAMERA AI -->
            <div class="card" style="text-align: center;">
                <h4 style="font-size: 14px; color: #38bdf8; margin-bottom: 12px;"><i class="fa-solid fa-camera"></i> Scan Absensi Wajah</h4>
                
                <div style="position: relative; width: 100%; max-width: 320px; height: 240px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #38bdf8;">
                    <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
                </div>

                <div style="margin-top: 15px;">
                    <button id="btnStartCamera" class="btn-primary"><i class="fa-solid fa-video"></i> Buka Kamera</button>
                    <button id="btnTakeAbsen" class="btn-primary" style="background: linear-gradient(135deg, #22c55e, #16a34a); display: none;" disabled><i class="fa-solid fa-check-circle"></i> Kirim Absen Kelas</button>
                </div>
                <p id="absenStatusText" style="font-size: 11px; color: #94a3b8; margin-top: 10px;">⏳ Menunggu Kamera...</p>
            </div>
        </div>

        <!-- ================= 3. DASHBOARD WALI KELAS ================= -->
        <div id="guruDashboardScreen" style="display: none;">
            <div class="header">
                <div>
                    <span class="badge-role" style="background: #f59e0b;">WALI KELAS</span>
                    <h3 id="guruNamaHeader" style="margin-top: 4px;">-</h3>
                    <p id="guruKelasHeader" style="font-size: 12px; color: #38bdf8; font-weight: 600;">-</p>
                </div>
                <i class="fa-solid fa-right-from-bracket btnLogout" style="color: #ef4444; cursor: pointer; font-size: 18px;" title="Logout"></i>
            </div>

            <!-- Monitoring Absensi Hari Ini -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h4 style="font-size: 14px; color: #38bdf8;"><i class="fa-solid fa-clipboard-user"></i> Absensi Hari Ini</h4>
                    <span id="txtTanggalHariIni" style="font-size: 10px; color: #94a3b8;">-</span>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <div style="flex:1; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 10px; color: #94a3b8;">MASUK</div>
                        <div id="countHadir" style="font-size: 18px; font-weight: bold; color: #4ade80;">0</div>
                    </div>
                    <div style="flex:1; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 10px; color: #94a3b8;">BELUM ABSEN</div>
                        <div id="countBelum" style="font-size: 18px; font-weight: bold; color: #f87171;">0</div>
                    </div>
                </div>

                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Nama Siswa</th>
                            <th>Status</th>
                            <th>Waktu</th>
                        </tr>
                    </thead>
                    <tbody id="listAbsensiWaliKelas">
                        <tr><td colspan="3" style="text-align: center; color: #64748b;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pengaturan ID Grup WhatsApp Kelas -->
            <div class="card">
                <h4 style="font-size: 14px; color: #38bdf8; margin-bottom: 12px;"><i class="fa-brands fa-whatsapp"></i> Pengaturan Grup WA Kelas</h4>
                <div class="form-group">
                    <label>ID Grup WhatsApp (Contoh: 120363041234567890@g.us)</label>
                    <input type="text" id="inputGroupWaId" placeholder="Masukkan ID Grup WA Kelas">
                </div>
                <button id="btnSimpanGroupWa" class="btn-primary" style="background: linear-gradient(135deg, #10b981, #059669);"><i class="fa-solid fa-floppy-disk"></i> Simpan ID Grup WA</button>
            </div>
        </div>

    </div>

    <!-- MAIN SCRIPT MODULE -->
    <script type="module">
        import { supabase } from './supabase.js';

        let videoStream = null;
        let isFaceModelLoaded = false;
        let isScanning = false;
        const WASENDER_API_KEY = '50021fcdb8bb9825a200cbda9a944ea6bbcf4c5454e7512cf12cff23ddc9dd56';

        const video = document.getElementById('webcam');
        const btnStartCamera = document.getElementById('btnStartCamera');
        const btnTakeAbsen = document.getElementById('btnTakeAbsen');
        const absenStatusText = document.getElementById('absenStatusText');

        document.addEventListener('DOMContentLoaded', () => {
            cekSession();
            loadAIModels();
        });

        // 1. LOAD AI FACE API
        async function loadAIModels() {
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
                isFaceModelLoaded = true;
                if (absenStatusText) absenStatusText.innerText = "Kamera Siap. Klik 'Buka Kamera'.";
            } catch (err) {
                if (absenStatusText) absenStatusText.innerText = "Mode Manual: Klik 'Buka Kamera' lalu Kirim.";
            }
        }

        // 2. CEK SESSION
        function cekSession() {
            const userSession = JSON.parse(localStorage.getItem('userSession'));
            if (userSession) {
                document.getElementById('loginScreen').style.display = 'none';
                if (userSession.role === 'siswa') {
                    document.getElementById('siswaDashboardScreen').style.display = 'block';
                    document.getElementById('siswaNamaHeader').innerText = userSession.nama_lengkap;
                    document.getElementById('siswaKelasHeader').innerText = `Kelas: ${userSession.kelas}`;
                } else if (userSession.role === 'wali_kelas') {
                    document.getElementById('guruDashboardScreen').style.display = 'block';
                    document.getElementById('guruNamaHeader').innerText = userSession.nama_guru;
                    document.getElementById('guruKelasHeader').innerText = `Wali Kelas: ${userSession.wali_kelas_dari}`;
                    loadMonitoringWaliKelas(userSession.wali_kelas_dari);
                    loadGroupWaSetting(userSession.wali_kelas_dari);
                }
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('siswaDashboardScreen').style.display = 'none';
                document.getElementById('guruDashboardScreen').style.display = 'none';
            }
        }

        // 3. LOGIC LOGIN (SISWA & GURU)
        document.getElementById('formLogin')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (role === 'siswa') {
                const { data, error } = await supabase.from('master_siswa').select('*').eq('username', username).eq('password', password).single();
                if (error || !data) {
                    Swal.fire('Login Gagal', 'Username/Password Siswa Salah', 'error');
                } else {
                    localStorage.setItem('userSession', JSON.stringify({ ...data, role: 'siswa' }));
                    cekSession();
                }
            } else {
                const { data, error } = await supabase.from('master_guru').select('*').eq('username', username).eq('password', password).single();
                if (error || !data) {
                    Swal.fire('Login Gagal', 'Username/Password Wali Kelas Salah', 'error');
                } else {
                    localStorage.setItem('userSession', JSON.stringify({ ...data, role: 'wali_kelas' }));
                    cekSession();
                }
            }
        });

        // 4. LOGOUT
        document.querySelectorAll('.btnLogout').forEach(btn => {
            btn.addEventListener('click', () => {
                localStorage.removeItem('userSession');
                location.reload();
            });
        });

        // 5. KAMERA & SCANNING ABSEN SISWA
        btnStartCamera?.addEventListener('click', async () => {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = videoStream;
                video.onloadedmetadata = () => {
                    video.play();
                    btnStartCamera.style.display = 'none';
                    btnTakeAbsen.style.display = 'block';
                    if (isFaceModelLoaded) {
                        isScanning = true;
                        deteksiWajah();
                    } else {
                        btnTakeAbsen.disabled = false;
                        absenStatusText.innerText = "Arahkan wajah & klik Kirim.";
                    }
                };
            } catch (err) {
                Swal.fire('Akses Ditolak', 'Izinkan akses kamera di browser Anda', 'error');
            }
        });

        async function deteksiWajah() {
            if (!isScanning || !videoStream) return;
            try {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }));
                if (detections && detections.length > 0) {
                    absenStatusText.innerHTML = "<span style='color:#4ade80;'>✅ Wajah Terdeteksi! Silakan Absen</span>";
                    btnTakeAbsen.disabled = false;
                } else {
                    absenStatusText.innerHTML = "<span style='color:#f59e0b;'>⏳ Dekatkan Wajah ke Kamera...</span>";
                    btnTakeAbsen.disabled = true;
                }
            } catch (e) {}
            if (isScanning) setTimeout(deteksiWajah, 300);
        }

        // 6. SIMPAN ABSENSI & KIRIM NOTIFIKASI KE GRUP WA KELAS
        btnTakeAbsen?.addEventListener('click', async () => {
            isScanning = false;
            const siswa = JSON.parse(localStorage.getItem('userSession'));
            
            // Render Gambar
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));

            if (videoStream) videoStream.getTracks().forEach(t => t.stop());
            absenStatusText.innerText = "⏳ Memproses data absensi...";

            // Upload Foto ke Supabase
            const fileName = `absen_${siswa.kelas}_${siswa.nama_lengkap.replace(/\s+/g, '_')}_${Date.now()}.jpg`;
            let fotoUrl = '-';
            const { data: uploadData } = await supabase.storage.from('foto-absen').upload(fileName, blob, { contentType: 'image/jpeg' });
            if (uploadData) {
                const { data: pubUrl } = supabase.storage.from('foto-absen').getPublicUrl(fileName);
                fotoUrl = pubUrl.publicUrl;
            }

            const todayStr = new Date().toISOString().split('T')[0]; // Format YYYY-MM-DD
            const jamStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            // Simpan Ke Tabel Absensi
            await supabase.from('absensi').insert([{
                nama: siswa.nama_lengkap,
                kelas: siswa.kelas,
                tanggal: todayStr,
                status: 'Hadir',
                foto_url: fotoUrl
            }]);

            // Ambil WhatsApp Group ID berdasarkan Kelas Siswa
            const { data: dataKelas } = await supabase.from('master_kelas').select('group_wa_id').eq('nama_kelas', siswa.kelas).single();

            if (dataKelas && dataKelas.group_wa_id) {
                const pesanWA = 
                    `*📌 ABSENSI KELAS ${siswa.kelas.toUpperCase()}*\n\n` +
                    `👤 Nama: *${siswa.nama_lengkap}*\n` +
                    `📅 Tanggal: ${todayStr}\n` +
                    `⏰ Jam: ${jamStr} WIB\n` +
                    `✅ Status: *Hadir Terverifikasi AI*`;

                // Kirim Notifikasi ke Grup WA Kelas via Wasender
                try {
                    await fetch('https://www.wasenderapi.com/api/send-message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${WASENDER_API_KEY}` },
                        body: JSON.stringify({
                            to: dataKelas.group_wa_id, // Mengirim ke Grup WA Kelas
                            text: pesanWA,
                            imageUrl: fotoUrl !== '-' ? fotoUrl : undefined
                        })
                    });
                } catch (e) {
                    console.error("Gagal kirim Notif WA:", e);
                }
            }

            Swal.fire('Absen Berhasil!', `Data absensi kamu sudah dikirim ke Grup WA ${siswa.kelas}`, 'success');
            btnStartCamera.style.display = 'block';
            btnTakeAbsen.style.display = 'none';
            absenStatusText.innerText = "Absensi hari ini selesai.";
        });

        // 7. MONITORING WALI KELAS (REKAP REAL-TIME HARIAN)
        async function loadMonitoringWaliKelas(namaKelas) {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('txtTanggalHariIni').innerText = todayStr;

            // 1. Ambil Semua Siswa di Kelas Ini
            const { data: allSiswa } = await supabase.from('master_siswa').select('*').eq('kelas', namaKelas);

            // 2. Ambil Siswa yang Sudah Absen Hari Ini
            const { data: absensiHariIni } = await supabase.from('absensi').select('*').eq('kelas', namaKelas).eq('tanggal', todayStr);

            const mapAbsen = new Map();
            if (absensiHariIni) {
                absensiHariIni.forEach(a => mapAbsen.set(a.nama, a));
            }

            let countHadir = 0;
            let countBelum = 0;
            let htmlRows = '';

            if (allSiswa && allSiswa.length > 0) {
                allSiswa.forEach(siswa => {
                    const dataAbsen = mapAbsen.get(siswa.nama_lengkap);
                    if (dataAbsen) {
                        countHadir++;
                        const jam = new Date(dataAbsen.waktu).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                        htmlRows += `
                            <tr>
                                <td><b>${siswa.nama_lengkap}</b></td>
                                <td><span class="status-badge status-hadir">Hadir</span></td>
                                <td>${jam} WIB</td>
                            </tr>
                        `;
                    } else {
                        countBelum++;
                        htmlRows += `
                            <tr>
                                <td>${siswa.nama_lengkap}</td>
                                <td><span class="status-badge status-belum">Belum</span></td>
                                <td>-</td>
                            </tr>
                        `;
                    }
                });
            } else {
                htmlRows = `<tr><td colspan="3" style="text-align:center; color:#64748b;">Belum ada siswa terdaftar di kelas ini.</td></tr>`;
            }

            document.getElementById('countHadir').innerText = countHadir;
            document.getElementById('countBelum').innerText = countBelum;
            document.getElementById('listAbsensiWaliKelas').innerHTML = htmlRows;
        }

        // 8. LOAD & UPDATE ID GRUP WA OLEH WALI KELAS
        async function loadGroupWaSetting(namaKelas) {
            const { data } = await supabase.from('master_kelas').select('group_wa_id').eq('nama_kelas', namaKelas).single();
            if (data && data.group_wa_id) {
                document.getElementById('inputGroupWaId').value = data.group_wa_id;
            }
        }

        document.getElementById('btnSimpanGroupWa')?.addEventListener('click', async () => {
            const userSession = JSON.parse(localStorage.getItem('userSession'));
            const newGroupWaId = document.getElementById('inputGroupWaId').value.trim();

            if (!newGroupWaId) {
                Swal.fire('Error', 'ID Grup WA tidak boleh kosong', 'warning');
                return;
            }

            const { error } = await supabase
                .from('master_kelas')
                .update({ group_wa_id: newGroupWaId })
                .eq('nama_kelas', userSession.wali_kelas_dari);

            if (error) {
                Swal.fire('Gagal', 'Terjadi kesalahan saat menyimpan ID Grup WA', 'error');
            } else {
                Swal.fire('Berhasil', `ID Grup WA untuk kelas ${userSession.wali_kelas_dari} berhasil disimpan!`, 'success');
            }
        });
    </script>
</body>
</html>
